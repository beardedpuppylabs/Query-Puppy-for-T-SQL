name: Bug report
description: Report a reproducible Query Puppy problem
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Query Puppy is a pre-1.0 project under active development, and reproducible reports help mature it toward a stable 1.0 release. Never include passwords, access tokens, credentials, complete connection strings, or sensitive production data. Anonymize SQL and schema identifiers where necessary.

  - type: input
    id: query-puppy-version
    attributes:
      label: Query Puppy version
      placeholder: e.g. 0.x.y
    validations:
      required: true

  - type: input
    id: editor-version
    attributes:
      label: Editor and version
      description: Include whether this is Visual Studio Code or VSCodium.
      placeholder: e.g. Visual Studio Code 1.x or VSCodium 1.x
    validations:
      required: true

  - type: input
    id: mssql-version
    attributes:
      label: Microsoft mssql version
      placeholder: ms-mssql.mssql x.y.z
    validations:
      required: true

  - type: dropdown
    id: feature-area
    attributes:
      label: Affected feature area
      options:
        - Completion / IntelliSense
        - Relationship-aware JOINs
        - Project or learned relationships
        - Signature Help / callable intelligence
        - Go to Definition / References / Highlights
        - Document Symbols / Outline
        - Hover
        - Diagnostics
        - Metadata loading / cache / refresh
        - Microsoft mssql integration
        - Smart Alias / wildcard expansion
        - Other
    validations:
      required: true

  - type: input
    id: sql-server-version
    attributes:
      label: SQL Server version
      description: Include this when the problem may depend on server behavior or catalog metadata.
      placeholder: e.g. SQL Server 2022

  - type: input
    id: database-context
    attributes:
      label: Database context
      description: Include only when relevant. Use anonymized names and never include a connection string.
      placeholder: Active database, schema, and relevant object kind

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide anonymized T-SQL and identify the exact cursor position, symbol, action, or editor command involved when relevant.
      render: sql
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: dropdown
    id: refresh-attempted
    attributes:
      label: Schema metadata refresh
      description: "If this issue depends on physical catalog metadata, did you run Query Puppy for T-SQL: Refresh Schema Metadata and wait for it to finish?"
      options:
        - "Yes"
        - "No"
        - Not applicable
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Query Puppy logs
      description: "Paste only relevant redacted lines from Output: Query Puppy for T-SQL. Do not include credentials, full connection strings, or sensitive data."
      render: text

  - type: checkboxes
    id: sensitive-data
    attributes:
      label: Sensitive-data check
      options:
        - label: I removed passwords, tokens, credentials, complete connection strings, and sensitive production data.
          required: true
