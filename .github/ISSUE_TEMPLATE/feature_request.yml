name: Feature request
description: Propose a focused semantic T-SQL developer-tooling improvement
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Query Puppy focuses on semantic T-SQL developer tooling for SQL Server in Visual Studio Code and VSCodium. Please avoid confidential SQL, schema details, and production data.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What SQL editing, understanding, navigation, or analysis task is difficult today, and who encounters it?
    validations:
      required: true

  - type: textarea
    id: proposed-behavior
    attributes:
      label: Desired behavior
      description: Describe the editor behavior or outcome you would find useful without prescribing an implementation.
    validations:
      required: true

  - type: textarea
    id: sql-example
    attributes:
      label: Realistic SQL example
      description: If applicable, provide anonymized T-SQL and mark the relevant cursor position or symbol.
      render: sql

  - type: textarea
    id: existing-tools
    attributes:
      label: Existing editor or mssql behavior
      description: Does Visual Studio Code, VSCodium, or Microsoft mssql already provide something similar? Where does it fall short?
    validations:
      required: true

  - type: textarea
    id: semantic-value
    attributes:
      label: Query Puppy semantic value
      description: How could Query Puppy's existing semantic models such as scopes, types, metadata, relationships, callables, symbols, or diagnostics add distinct value?
    validations:
      required: true

  - type: checkboxes
    id: boundaries
    attributes:
      label: Project boundaries
      options:
        - label: This request is focused on SQL Server/T-SQL developer tooling and does not require Query Puppy to become a second query-execution or database-administration workbench.
          required: true
        - label: This request does not depend on private or unsupported editor APIs as a required product design.
          required: true
